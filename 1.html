<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Now | Quick Bite Cafe</title>
<meta name="theme-color" content="#1a0a00">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --fire:#FF4500;--fire-dark:#c73300;--gold:#FFB300;
  --bg:#0f0700;--card:#1c1008;--card2:#231508;
  --white:#fff;--muted:#a08060;
  --green:#25D366;--radius:16px;
  --border:rgba(255,69,0,0.18);
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--white);font-family:'Nunito',sans-serif;overflow-x:hidden;padding-bottom:60px}

/* HEADER */
header{
  position:sticky;top:0;z-index:999;
  background:rgba(15,7,0,0.97);backdrop-filter:blur(12px);
  border-bottom:2px solid var(--border);
  padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:62px;
}
.logo-area{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-ring{width:42px;height:42px;border-radius:50%;border:2.5px solid var(--fire);padding:2px;overflow:hidden;box-shadow:0 0 10px rgba(255,69,0,0.35)}
.logo-ring img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.logo-text h1{font-family:'Bebas Neue',sans-serif;font-size:1.35rem;letter-spacing:1px;line-height:1}
.logo-text span{font-size:0.62rem;color:var(--fire);font-weight:700;letter-spacing:2px}
.back-btn{
  background:rgba(255,69,0,0.12);border:1px solid var(--border);
  color:var(--fire);padding:8px 14px;border-radius:50px;
  font-size:0.82rem;font-weight:800;text-decoration:none;
  display:flex;align-items:center;gap:6px;transition:background .15s;
}
.back-btn:active{background:rgba(255,69,0,0.25)}

/* PAGE HEADER */
.page-top{
  background:linear-gradient(135deg,#2a0f00 0%,#0f0700 100%);
  border-bottom:1px solid var(--border);
  padding:24px 16px 20px;
}
.page-top h2{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:1.5px;margin-bottom:4px}
.page-top p{color:var(--muted);font-size:0.85rem;font-weight:600}
.page-top h2 span{color:var(--fire)}

/* SEARCH BAR */
.search-wrap{padding:16px;max-width:800px;margin:0 auto}
.search-box{
  position:relative;display:flex;align-items:center;
}
.search-icon{position:absolute;left:14px;font-size:1.1rem;pointer-events:none}
.search-input{
  width:100%;background:var(--card);
  border:1.5px solid var(--border);border-radius:50px;
  color:var(--white);padding:13px 16px 13px 42px;
  font-family:'Nunito',sans-serif;font-size:0.95rem;font-weight:600;
  outline:none;transition:border-color .2s;
}
.search-input::placeholder{color:var(--muted)}
.search-input:focus{border-color:var(--fire)}

/* CATEGORIES */
.cats-wrap{padding:0 16px 16px;max-width:800px;margin:0 auto}
.cats{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat-btn{
  flex-shrink:0;background:var(--card);
  border:1.5px solid var(--border);
  color:var(--muted);padding:9px 18px;border-radius:50px;
  font-family:'Nunito',sans-serif;font-size:0.82rem;font-weight:800;
  cursor:pointer;transition:all .15s;white-space:nowrap;letter-spacing:.3px;
}
.cat-btn.active,.cat-btn:active{background:var(--fire);border-color:var(--fire);color:#fff}
.cat-btn:hover{border-color:var(--fire);color:var(--white)}

/* PRODUCT GRID */
.grid-wrap{padding:0 16px;max-width:800px;margin:0 auto}
.product-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:16px;
}
@media(max-width:360px){.product-grid{grid-template-columns:repeat(2,1fr)}}

/* PRODUCT CARD */
.prod-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;
  transition:transform .18s,border-color .18s;
  position:relative;
}
.prod-card:active{transform:scale(0.98)}
.prod-card:hover{border-color:rgba(255,69,0,0.4);transform:translateY(-3px)}
.prod-img-wrap{position:relative;width:100%;padding-top:72%;overflow:hidden;background:#1a0d04}
.prod-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;transition:transform .3s;
}
.prod-card:hover .prod-img{transform:scale(1.06)}
.prod-badge{
  position:absolute;top:8px;left:8px;
  background:var(--fire);color:#fff;
  font-size:0.62rem;font-weight:800;letter-spacing:1px;
  padding:3px 9px;border-radius:50px;text-transform:uppercase;
}
.prod-body{padding:12px}
.prod-name{font-weight:800;font-size:0.88rem;line-height:1.3;margin-bottom:6px;color:var(--white)}
.prod-price{
  font-family:'Bebas Neue',sans-serif;font-size:1.3rem;
  color:var(--gold);letter-spacing:.5px;margin-bottom:10px;
}
.prod-price span{font-family:'Nunito',sans-serif;font-size:0.7rem;color:var(--muted);font-weight:700}
.order-btn{
  width:100%;background:var(--green);color:#fff;
  border:none;border-radius:10px;padding:10px 8px;
  font-family:'Nunito',sans-serif;font-weight:800;font-size:0.8rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
  transition:opacity .15s;
}
.order-btn:active{opacity:.82}
.order-btn svg{width:15px;height:15px;fill:#fff;flex-shrink:0}

/* EMPTY STATE */
.empty-state{
  text-align:center;padding:60px 20px;grid-column:1/-1;
}
.empty-state div{font-size:3rem;margin-bottom:12px}
.empty-state p{color:var(--muted);font-size:0.95rem;font-weight:600}

/* RESULTS COUNT */
.results-info{
  color:var(--muted);font-size:0.8rem;font-weight:700;
  padding:0 16px 12px;max-width:800px;margin:0 auto;
}

/* FOOTER */
footer{
  background:#080400;border-top:1px solid var(--border);
  padding:24px 16px;text-align:center;margin-top:40px;
}
.footer-logo{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--fire);letter-spacing:2px}
.footer-contact{color:var(--gold);font-weight:700;font-size:0.88rem;margin-top:4px}
.footer-copy{color:rgba(160,128,96,.45);font-size:0.72rem;margin-top:8px}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <a class="logo-area" href="index.html">
    <div class="logo-ring">
      <img src="https://lh3.googleusercontent.com/d/1Be2aAkqVqA8grX0Vf4fIOoPrGzYbWig-" alt="Quick Bite Logo" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 60 60%22><rect width=%2260%22 height=%2260%22 rx=%2230%22 fill=%22%23FF4500%22/><text x=%2230%22 y=%2238%22 font-size=%2228%22 text-anchor=%22middle%22 fill=%22white%22>QB</text></svg>'">
    </div>
    <div class="logo-text">
      <h1>Quick Bite</h1>
      <span>Cafe &amp; Fast Food</span>
    </div>
  </a>
  <a class="back-btn" href="index.html">← Home</a>
</header>

<!-- PAGE TOP -->
<div class="page-top">
  <h2>OUR <span>MENU</span></h2>
  <p>Pick your favourite — order via WhatsApp in one tap 🚀</p>
</div>

<!-- SEARCH -->
<div class="search-wrap">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="searchInput" type="text" placeholder="Search burgers, pizza, deals...">
  </div>
</div>

<!-- CATEGORIES -->
<div class="cats-wrap">
  <div class="cats" id="catsBar">
    <button class="cat-btn active" data-cat="all">🍽️ All Items</button>
    <button class="cat-btn" data-cat="burger">🍔 Burgers</button>
    <button class="cat-btn" data-cat="pizza">🍕 Pizza</button>
    <button class="cat-btn" data-cat="chicken">🍗 Chicken</button>
    <button class="cat-btn" data-cat="deals">🎁 Deals</button>
    <button class="cat-btn" data-cat="drinks">🥤 Drinks</button>
    <button class="cat-btn" data-cat="sides">🍟 Sides</button>
  </div>
</div>

<!-- RESULTS INFO -->
<div class="results-info" id="resultsInfo"></div>

<!-- PRODUCT GRID -->
<div class="grid-wrap">
  <div class="product-grid" id="productGrid"></div>
</div>

<!-- FOOTER -->
<footer>
  <div class="footer-logo">QUICK BITE</div>
  <div class="footer-contact">📞 0315-9392716</div>
  <div class="footer-copy">© 2025 Quick Bite Cafe. All rights reserved.</div>
</footer>

<script>
// ════════════════════════════════════════════
// PRODUCT DATA — Edit this list to update menu
// ════════════════════════════════════════════
const PRODUCTS = [
  // BURGERS
  {id:1, name:"Classic Zinger Burger", cat:"burger", price:320, badge:"Popular",
   img:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400&q=75"},
  {id:2, name:"Double Beef Smash Burger", cat:"burger", price:450, badge:"Best Seller",
   img:"https://images.unsplash.com/photo-1553979459-d2229ba7433b?w=400&q=75"},
  {id:3, name:"Crispy Chicken Burger", cat:"burger", price:280, badge:null,
   img:"https://images.unsplash.com/photo-1550317138-10000687a72b?w=400&q=75"},
  {id:4, name:"BBQ Beef Burger", cat:"burger", price:380, badge:null,
   img:"https://images.unsplash.com/photo-1609167830220-7164aa360951?w=400&q=75"},
  {id:5, name:"Mushroom Swiss Burger", cat:"burger", price:420, badge:"New",
   img:"https://images.unsplash.com/photo-1571091718767-18b5b1457add?w=400&q=75"},

  // PIZZA
  {id:6, name:"Chicken Tikka Pizza", cat:"pizza", price:650, badge:"Popular",
   img:"https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=400&q=75"},
  {id:7, name:"BBQ Chicken Pizza", cat:"pizza", price:700, badge:null,
   img:"https://images.unsplash.com/photo-1513104890138-7c749659a591?w=400&q=75"},
  {id:8, name:"Beef Pepperoni Pizza", cat:"pizza", price:750, badge:"Best Seller",
   img:"https://images.unsplash.com/photo-1534308983496-4fabb1a015ee?w=400&q=75"},
  {id:9, name:"Veggie Supreme Pizza", cat:"pizza", price:580, badge:null,
   img:"https://images.unsplash.com/photo-1574071318508-1cdbab80d002?w=400&q=75"},

  // CHICKEN
  {id:10, name:"Crispy Fried Chicken (4 Pcs)", cat:"chicken", price:480, badge:"Popular",
   img:"https://images.unsplash.com/photo-1626645738196-c2a7c87a8f58?w=400&q=75"},
  {id:11, name:"Chicken Strips (6 Pcs)", cat:"chicken", price:390, badge:null,
   img:"https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?w=400&q=75"},
  {id:12, name:"Hot Wings (8 Pcs)", cat:"chicken", price:420, badge:"🌶️ Spicy",
   img:"https://images.unsplash.com/photo-1567620832903-9fc6debc209f?w=400&q=75"},
  {id:13, name:"Grilled Chicken Platter", cat:"chicken", price:550, badge:null,
   img:"https://images.unsplash.com/photo-1598515214211-89d3c73ae83b?w=400&q=75"},

  // DEALS
  {id:14, name:"Family Deal – 2 Burgers + Fries + 2 Drinks", cat:"deals", price:1100, badge:"Save 200",
   img:"https://images.unsplash.com/photo-1582196016295-f8c8bd4b3a99?w=400&q=75"},
  {id:15, name:"Couple Deal – Burger + Pizza + Drinks", cat:"deals", price:1350, badge:"Best Value",
   img:"https://images.unsplash.com/photo-1552566626-52f8b828add9?w=400&q=75"},
  {id:16, name:"Student Deal – Burger + Fries + Drink", cat:"deals", price:580, badge:"Popular",
   img:"https://images.unsplash.com/photo-1561758033-7e924f619b47?w=400&q=75"},

  // DRINKS
  {id:17, name:"Fresh Lemonade (Large)", cat:"drinks", price:150, badge:null,
   img:"https://images.unsplash.com/photo-1621506289937-a8e4df240d0b?w=400&q=75"},
  {id:18, name:"Oreo Milkshake", cat:"drinks", price:220, badge:"Popular",
   img:"https://images.unsplash.com/photo-1572490122747-3f287ece5855?w=400&q=75"},
  {id:19, name:"Soft Drink (Can)", cat:"drinks", price:80, badge:null,
   img:"https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=400&q=75"},
  {id:20, name:"Mango Smoothie", cat:"drinks", price:200, badge:"Fresh",
   img:"https://images.unsplash.com/photo-1621506289937-a8e4df240d0b?w=400&q=75"},

  // SIDES
  {id:21, name:"Loaded Fries", cat:"sides", price:220, badge:"Popular",
   img:"https://images.unsplash.com/photo-1576777647209-e8733d7b851d?w=400&q=75"},
  {id:22, name:"Onion Rings (8 Pcs)", cat:"sides", price:180, badge:null,
   img:"https://images.unsplash.com/photo-1639024471283-03518883512d?w=400&q=75"},
  {id:23, name:"Coleslaw Cup", cat:"sides", price:120, badge:null,
   img:"https://images.unsplash.com/photo-1572441713132-c542a4fde318?w=400&q=75"},
  {id:24, name:"Garlic Bread (4 Pcs)", cat:"sides", price:160, badge:null,
   img:"https://images.unsplash.com/photo-1573140247632-f8fd74997d5c?w=400&q=75"},
];

// WA number
const WA_NUM = "923159392716";

// ── STATE ──
let currentCat = "all";
let searchTerm = "";

// ── RENDER ──
function render() {
  const grid = document.getElementById("productGrid");
  const info = document.getElementById("resultsInfo");

  let filtered = PRODUCTS.filter(p => {
    const matchCat = currentCat === "all" || p.cat === currentCat;
    const matchSearch = p.name.toLowerCase().includes(searchTerm.toLowerCase());
    return matchCat && matchSearch;
  });

  info.textContent = filtered.length > 0
    ? `Showing ${filtered.length} item${filtered.length > 1 ? "s" : ""}`
    : "";

  if (filtered.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <div>😕</div>
        <p>No items found for "<strong>${searchTerm || currentCat}</strong>"</p>
      </div>`;
    return;
  }

  grid.innerHTML = filtered.map(p => `
    <div class="prod-card">
      <div class="prod-img-wrap">
        <img class="prod-img" src="${p.img}" alt="${p.name}" loading="lazy">
        ${p.badge ? `<span class="prod-badge">${p.badge}</span>` : ""}
      </div>
      <div class="prod-body">
        <div class="prod-name">${p.name}</div>
        <div class="prod-price">Rs. ${p.price.toLocaleString()} <span>PKR</span></div>
        <button class="order-btn" onclick="orderViaWA(${p.id})">
          <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          Order on WhatsApp
        </button>
      </div>
    </div>
  `).join("");
}

// ── WHATSAPP ORDER ──
function orderViaWA(id) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;
  const msg = encodeURIComponent(
    `🍽️ *New Order – Quick Bite Cafe*\n` +
    `━━━━━━━━━━━━━━━━━\n` +
    `🛒 *Item:* ${p.name}\n` +
    `💰 *Price:* Rs. ${p.price.toLocaleString()} PKR\n` +
    `━━━━━━━━━━━━━━━━━\n` +
    `Please confirm my order and delivery address. Thank you! 🙏`
  );
  window.open(`https://wa.me/${WA_NUM}?text=${msg}`, "_blank");
}

// ── CATEGORY FILTER ──
document.getElementById("catsBar").addEventListener("click", e => {
  const btn = e.target.closest(".cat-btn");
  if (!btn) return;
  document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  currentCat = btn.dataset.cat;
  render();
});

// ── SEARCH ──
document.getElementById("searchInput").addEventListener("input", e => {
  searchTerm = e.target.value.trim();
  // Reset category when searching
  if (searchTerm) {
    document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
    document.querySelector('[data-cat="all"]').classList.add("active");
    currentCat = "all";
  }
  render();
});

// ── INIT ──
render();
</script>
</body>
</html>
