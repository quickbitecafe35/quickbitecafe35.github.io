<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --fire:#FF4500;--fire-dark:#c73300;--gold:#FFB300;
  --bg:#0f0700;--card:#1c1008;--card2:#231508;
  --white:#fff;--muted:#a08060;
  --green:#25D366;--radius:16px;
  --border:rgba(255,69,0,0.18);
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--white);font-family:'Nunito',sans-serif;overflow-x:hidden;padding-bottom:80px}

/* HEADER */
header{
  position:sticky;top:0;z-index:999;
  background:rgba(15,7,0,0.97);backdrop-filter:blur(12px);
  border-bottom:2px solid var(--border);
  padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:62px;
}
.logo-area{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-ring{width:42px;height:42px;border-radius:50%;border:2.5px solid var(--fire);padding:2px;overflow:hidden;box-shadow:0 0 10px rgba(255,69,0,0.35)}
.logo-ring img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.logo-text h1{font-family:'Bebas Neue',sans-serif;font-size:1.35rem;letter-spacing:1px;line-height:1}
.logo-text span{font-size:0.62rem;color:var(--fire);font-weight:700;letter-spacing:2px}
.cart-header-btn{
  background:rgba(255,69,0,0.16);
  border:1px solid var(--border);
  border-radius:50px;
  padding:8px 14px;
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:800;
  font-size:0.85rem;
  cursor:pointer;
  transition:all 0.1s;
  color:var(--white);
}
.cart-header-btn:active{background:var(--fire);}
.cart-count-badge{
  background:var(--fire);
  border-radius:30px;
  padding:2px 8px;
  font-size:0.7rem;
  font-weight:900;
}

/* PAGE HEADER */
.page-top{
  background:linear-gradient(135deg,#2a0f00 0%,#0f0700 100%);
  border-bottom:1px solid var(--border);
  padding:24px 16px 20px;
}
.page-top h2{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:1.5px;margin-bottom:4px}
.page-top p{color:var(--muted);font-size:0.85rem;font-weight:600}
.page-top h2 span{color:var(--fire)}

/* SEARCH BAR */
.search-wrap{padding:16px;max-width:800px;margin:0 auto}
.search-box{position:relative;display:flex;align-items:center;}
.search-icon{position:absolute;left:14px;font-size:1.1rem;pointer-events:none}
.search-input{
  width:100%;background:var(--card);
  border:1.5px solid var(--border);border-radius:50px;
  color:var(--white);padding:13px 16px 13px 42px;
  font-family:'Nunito',sans-serif;font-size:0.95rem;font-weight:600;
  outline:none;transition:border-color .2s;
}
.search-input::placeholder{color:var(--muted)}
.search-input:focus{border-color:var(--fire)}

/* CATEGORIES */
.cats-wrap{padding:0 16px 16px;max-width:800px;margin:0 auto}
.cats{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat-btn{
  flex-shrink:0;background:var(--card);
  border:1.5px solid var(--border);
  color:var(--muted);padding:9px 18px;border-radius:50px;
  font-family:'Nunito',sans-serif;font-size:0.82rem;font-weight:800;
  cursor:pointer;transition:all .15s;white-space:nowrap;letter-spacing:.3px;
}
.cat-btn.active,.cat-btn:active{background:var(--fire);border-color:var(--fire);color:#fff}
.cat-btn:hover{border-color:var(--fire);color:var(--white)}

/* PRODUCT GRID */
.grid-wrap{padding:0 16px;max-width:800px;margin:0 auto}
.product-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:16px;
}
@media(max-width:360px){.product-grid{grid-template-columns:repeat(2,1fr)}}

/* PRODUCT CARD */
.prod-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;
  transition:transform .18s,border-color .18s;
  position:relative;
}
.prod-card:active{transform:scale(0.98)}
.prod-img-wrap{position:relative;width:100%;padding-top:72%;overflow:hidden;background:#1a0d04}
.prod-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;transition:transform .3s;
}
.prod-body{padding:12px}
.prod-name{font-weight:800;font-size:0.88rem;line-height:1.3;margin-bottom:4px;color:var(--white)}
.prod-desc{
  font-size:0.7rem;
  color:var(--muted);
  margin-bottom:8px;
  line-height:1.3;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.prod-price{
  font-family:'Bebas Neue',sans-serif;font-size:1.25rem;
  color:var(--gold);letter-spacing:.5px;margin-bottom:10px;
}
.prod-price span{font-family:'Nunito',sans-serif;font-size:0.65rem;color:var(--muted);font-weight:700}
.add-cart-btn{
  width:100%;background:#2c1a0e;
  border:1px solid var(--border);
  color:var(--white);border-radius:12px;
  padding:9px 8px;
  font-family:'Nunito',sans-serif;font-weight:800;font-size:0.75rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all .2s;
}
.add-cart-btn:active{background:var(--fire);border-color:var(--fire);color:white}
.add-cart-btn svg{width:16px;height:16px;fill:var(--gold)}

/* RESULTS INFO */
.results-info{
  color:var(--muted);font-size:0.8rem;font-weight:700;
  padding:0 16px 12px;max-width:800px;margin:0 auto;
}
.empty-state{
  text-align:center;padding:60px 20px;grid-column:1/-1;
}
.empty-state div{font-size:3rem;margin-bottom:12px}
.empty-state p{color:var(--muted);font-size:0.95rem;font-weight:600}


/* FLOATING CART + MODAL */
.floating-cart{
  position:fixed;
  bottom:20px;
  right:16px;
  background:var(--fire);
  width:58px;
  height:58px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 18px rgba(0,0,0,0.5);
  cursor:pointer;
  z-index:1000;
  transition:transform 0.1s;
  border:2px solid #ffcc88;
}
.floating-cart:active{transform:scale(0.94);}
.floating-cart span{
  position:absolute;
  top:-5px;
  right:-5px;
  background:white;
  color:black;
  font-weight:900;
  font-size:0.7rem;
  border-radius:30px;
  padding:2px 7px;
  box-shadow:0 0 0 2px var(--fire);
}
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  backdrop-filter:blur(5px);
  z-index:1100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.cart-modal{
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:24px;
  width:100%;
  max-width:500px;
  max-height:85vh;
  overflow-y:auto;
  padding:20px;
  color:white;
}
.cart-modal h3{font-family:'Bebas Neue';font-size:1.8rem;margin-bottom:16px;color:var(--fire)}
.cart-items-list{max-height:280px;overflow-y:auto;margin-bottom:20px;}
.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(0,0,0,0.3);
  margin-bottom:8px;
  padding:8px 12px;
  border-radius:40px;
  font-size:0.85rem;
}
.item-info{flex:2;}
.item-qty{display:flex;gap:8px;align-items:center;}
.item-qty button{background:var(--fire);border:none;width:26px;height:26px;border-radius:100%;color:white;font-weight:bold;cursor:pointer;}
.cart-total{font-weight:800;font-size:1.2rem;border-top:1px solid var(--border);padding-top:12px;margin:12px 0;}
.form-group{margin-bottom:12px;}
.form-group input, .form-group textarea{
  width:100%;
  background:#1f130a;
  border:1px solid var(--border);
  border-radius:18px;
  padding:12px 16px;
  color:white;
  font-family:'Nunito';
  outline:none;
}
.form-group label{font-size:0.75rem;font-weight:700;display:block;margin-bottom:5px;color:var(--gold)}
.send-order-btn{
  background:var(--green);
  width:100%;
  border:none;
  padding:14px;
  font-weight:800;
  border-radius:40px;
  font-size:1rem;
  margin-top:10px;
  cursor:pointer;
  display:flex;
  gap:8px;
  justify-content:center;
  align-items:center;
}
.close-modal{background:transparent;border:1px solid var(--border);padding:8px;border-radius:30px;width:100%;margin-top:8px;color:var(--muted);cursor:pointer;}
footer{
  background:#080400;border-top:1px solid var(--border);
  padding:24px 16px;text-align:center;margin-top:40px;
}
</style>
</head>

function getUniqueCategories() {
  let catsSet = new Set(PRODUCTS.map(p => p.cat));
  return ["All", ...Array.from(catsSet).sort()];
}

function renderCategories() {
  const catsContainer = document.getElementById("catsBar");
  const categories = getUniqueCategories();
  catsContainer.innerHTML = categories.map(cat => `
    <button class="cat-btn ${currentCat === cat ? 'active' : ''}" data-cat="${cat}">${cat === "All" ? "🍽️ All Items" : cat}</button>
  `).join("");
  document.querySelectorAll(".cat-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      const selected = btn.dataset.cat;
      currentCat = selected;
      renderCategories();
      renderProducts();
    });
  });
}

function renderProducts() {
  const grid = document.getElementById("productGrid");
  const info = document.getElementById("resultsInfo");
  let filtered = PRODUCTS.filter(p => {
    const matchCat = currentCat === "All" || p.cat === currentCat;
    const matchSearch = p.title.toLowerCase().includes(searchTerm.toLowerCase()) || p.desc.toLowerCase().includes(searchTerm.toLowerCase());
    return matchCat && matchSearch;
  });
  info.textContent = filtered.length ? `🍽️ ${filtered.length} delicious items` : "";
  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state"><div>😋</div><p>No items found for "${searchTerm || currentCat}"</p></div>`;
    return;
  }
  grid.innerHTML = filtered.map(p => `
    <div class="prod-card">
      <div class="prod-img-wrap"><img class="prod-img" src="${p.img}" alt="${p.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/200?text=QB'"></div>
      <div class="prod-body">
        <div class="prod-name">${p.title}</div>
        <div class="prod-desc">${p.desc.substring(0, 40)}</div>
        <div class="prod-price">Rs. ${p.price.toLocaleString()} <span>PKR</span></div>
        <button class="add-cart-btn" data-id="${p.id}">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M19 7h-3V6c0-1.66-1.34-3-3-3H9C7.34 3 6 4.34 6 6v1H3v1h1l1 10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2l1-10h1V7h-3zM9 6c0-.55.45-1 1-1h4c.55 0 1 .45 1 1v1H9V6zm8 12H7l-.83-8h13.66L17 18z"/><circle cx="8.5" cy="19.5" r="1.5"/><circle cx="15.5" cy="19.5" r="1.5"/></svg>
          ADD TO CART
        </button>
      </div>
    </div>
  `).join("");
  document.querySelectorAll(".add-cart-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      const id = parseInt(btn.dataset.id);
      addToCart(id);
      updateCartUI();
    });
  });
}

function addToCart(id) {
  if (cart[id]) cart[id] += 1;
  else cart[id] = 1;
  saveCart();
  updateCartUI();
  showMiniFeedback();
}

function saveCart() {
  localStorage.setItem('quickBiteCart', JSON.stringify(cart));
}

function updateCartUI() {
  const totalItems = Object.values(cart).reduce((a,b)=>a+b,0);
  document.getElementById("headerCartCount").innerText = totalItems;
  document.getElementById("floatingCount").innerText = totalItems;
}

function showMiniFeedback() {
  const toast = document.createElement("div");
  toast.innerText = "✓ Added to cart";
  toast.style.position="fixed"; toast.style.bottom="90px"; toast.style.right="20px"; toast.style.background="var(--green)"; toast.style.padding="8px 16px"; toast.style.borderRadius="50px"; toast.style.zIndex="2000"; toast.style.fontWeight="bold";
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(), 1200);
}

function renderCartModalContent() {
  const container = document.getElementById("cartItemsContainer");
  if (Object.keys(cart).length === 0) {
    container.innerHTML = "<div style='padding:20px;text-align:center'>🛒 Cart is empty. Add some items!</div>";
    document.getElementById("cartTotalPrice").innerHTML = "Total: Rs. 0";
    return;
  }
  let itemsHtml = "";
  let total = 0;
  for (let idStr in cart) {
    const id = parseInt(idStr);
    const product = PRODUCTS.find(p => p.id === id);
    if (!product) continue;
    const qty = cart[id];
    const itemTotal = product.price * qty;
    total += itemTotal;
    itemsHtml += `
      <div class="cart-item">
        <div class="item-info"><strong>${product.title}</strong><br>Rs.${product.price} x ${qty}</div>
        <div class="item-qty">
          <button class="cart-dec" data-id="${id}">-</button>
          <span style="min-width:28px;text-align:center">${qty}</span>
          <button class="cart-inc" data-id="${id}">+</button>
          <button class="cart-remove" data-id="${id}" style="background:#c73300; margin-left:6px;">🗑️</button>
        </div>
      </div>
    `;
  }
  container.innerHTML = itemsHtml;
  document.getElementById("cartTotalPrice").innerHTML = `Total: Rs. ${total.toLocaleString()}`;
  document.querySelectorAll(".cart-inc").forEach(btn => {
    btn.addEventListener("click", (e) => { let id = parseInt(btn.dataset.id); cart[id] = (cart[id]||0)+1; saveCart(); renderCartModalContent(); updateCartUI(); });
  });
  document.querySelectorAll(".cart-dec").forEach(btn => {
    btn.addEventListener("click", (e) => { let id = parseInt(btn.dataset.id); if(cart[id] > 1) cart[id]--; else delete cart[id]; saveCart(); renderCartModalContent(); updateCartUI(); });
  });
  document.querySelectorAll(".cart-remove").forEach(btn => {
    btn.addEventListener("click", (e) => { let id = parseInt(btn.dataset.id); delete cart[id]; saveCart(); renderCartModalContent(); updateCartUI(); });
  });
}

function openCartModal() { renderCartModalContent(); document.getElementById("cartModalOverlay").style.display = "flex"; }
function closeModal() { document.getElementById("cartModalOverlay").style.display = "none"; }

function sendWhatsappOrder() {
  const name = document.getElementById("customerName").value.trim();
  const phone = document.getElementById("customerPhone").value.trim();
  const address = document.getElementById("customerAddress").value.trim();
  if (!name || !phone || !address) { alert("❌ Please fill Name, Phone & Address"); return; }
  if (Object.keys(cart).length === 0) { alert("Cart is empty"); return; }
  let orderDetails = `🍽️ *NEW ORDER - QUICK BITE CAFE* 🍽️\n\n👤 *Customer:* ${name}\n📞 *Phone:* ${phone}\n🏠 *Address:* ${address}\n━━━━━━━━━━━━━━━━━\n🛒 *ORDER ITEMS:*\n`;
  let total = 0;
  for (let idStr in cart) {
    const product = PRODUCTS.find(p => p.id == idStr);
    const qty = cart[idStr];
    const sub = product.price * qty;
    total += sub;
    orderDetails += `➤ ${product.title} × ${qty} = Rs. ${sub.toLocaleString()}\n`;
  }
  orderDetails += `━━━━━━━━━━━━━━━━━\n💰 *TOTAL: Rs. ${total.toLocaleString()} PKR*\n🙏 Please confirm & deliver soon. Thank you!`;
  const encodedMsg = encodeURIComponent(orderDetails);
  window.open(`https://wa.me/923159392716?text=${encodedMsg}`, "_blank");
  closeModal();
}

document.getElementById("searchInput").addEventListener("input", (e) => { searchTerm = e.target.value; currentCat = "All"; renderCategories(); renderProducts(); });
document.getElementById("floatingCartBtn").addEventListener("click", openCartModal);
document.getElementById("cartIconHeader").addEventListener("click", openCartModal);
document.getElementById("closeModalBtn").addEventListener("click", closeModal);
document.getElementById("sendOrderWhatsappBtn").addEventListener("click", sendWhatsappOrder);
document.getElementById("cartModalOverlay").addEventListener("click", (e) => { if(e.target === document.getElementById("cartModalOverlay")) closeModal(); });

renderCategories();
renderProducts();
updateCartUI();
</script>
</body>
</html>
